<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presently</title>
<meta name="theme-color" content="#0d0c0b">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Rammetto+One&display=swap" rel="stylesheet">
<style>
/* VOICE: loud retro sale-flyer energy, pointed at gifting
   COLOUR+TYPE: black ground, cream hairline frames, flat blue / pink / yellow / green / orange / red; Rammetto One display, Poppins body
   SIGNATURE: arched cream frame with starburst medallions, pillars with eyes flanking a green sunburst */
:root{color-scheme:dark;--bg:#0d0c0b;--card:#171513;--card2:#211e1a;--ink:#f6ecd4;--soft:#b8ad96;--line:#f6ecd4;--dash:#3b3630;
 --blue:#4b87c9;--pink:#f08da4;--yellow:#f5b945;--green:#2f9b4c;--red:#e8483f;--orange:#ee7b2f;--sky:#8fbbe8;--blk:#0d0c0b;
 --bd:2px solid var(--line)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Poppins,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance;font-weight:400}
svg{display:block}
.ol{font-family:"Rammetto One",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}
.ol.pk{color:var(--pink)}.ol.gr{color:var(--yellow)}.ol.co{color:var(--pink)}.ol.bl{color:var(--sky)}
.disp{font-family:"Rammetto One",sans-serif;font-weight:400;text-transform:uppercase}

/* header frame */
.hd{padding:26px 0 6px}
.frame{position:relative;border:var(--bd);border-bottom:0;border-radius:44px 44px 0 0;padding:34px 0 0;margin:0 6px}
.frame:before{content:"";position:absolute;inset:8px 8px 0;border:1.5px solid var(--line);border-bottom:0;border-radius:36px 36px 0 0;pointer-events:none;opacity:.55}
.badge{position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:var(--bg);border:var(--bd);border-radius:12px;padding:5px 16px;display:flex;align-items:center;gap:10px;white-space:nowrap;font:700 13px Poppins,sans-serif;letter-spacing:3px;color:var(--ink);z-index:2}
.badge svg{width:16px;height:16px}
.med{position:absolute;top:96px;width:46px;height:46px;border-radius:50%;border:var(--bd);background:var(--bg);display:grid;place-items:center;z-index:2}
.med.l{left:-25px}.med.r{right:-25px}
.med svg{width:30px;height:30px}
.hbox{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding:0 clamp(22px,4vw,44px)}
.brand{flex:1 1 300px}
.wm{font:400 clamp(44px,9vw,96px)/.95 "Rammetto One",sans-serif;text-transform:uppercase;letter-spacing:-.5px}
.wm .b{color:var(--blue)}.wm .p{color:var(--pink)}.wm .y{color:var(--yellow)}
.tagline{margin:10px 0 0;font:400 clamp(15px,2.2vw,20px) "Rammetto One",sans-serif;text-transform:uppercase;color:var(--ink);transform:rotate(-2deg);transform-origin:left}
.hctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.yr{display:flex;align-items:center;gap:2px;border:var(--bd);border-radius:99px;padding:2px}
.yr span{font:20px "Rammetto One",sans-serif;padding:0 4px;min-width:70px;text-align:center;color:var(--yellow)}
.yr button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font:24px/1 Poppins,sans-serif;font-weight:700}
.yr button:hover{background:var(--card2)}
.cta{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;border-radius:99px;padding:0 20px;min-height:46px;background:var(--pink);color:var(--blk);font:16px "Rammetto One",sans-serif;text-transform:uppercase;box-shadow:3px 3px 0 var(--yellow)}
.cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--yellow)}
.cta svg{width:18px;height:18px}
.cta:disabled{opacity:.6}
.scene{display:block;width:100%;height:auto;max-height:150px;margin-top:14px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:0}
.blk{background:var(--card);border:var(--bd);border-radius:22px;padding:14px 18px}
.blk h2{font-size:20px}
.lbl{font-weight:600;color:var(--soft);font-size:13px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.big{margin:4px 0 10px;white-space:nowrap;font-family:"Rammetto One",sans-serif}
.big b{font-weight:400;font-size:clamp(32px,5vw,48px);color:var(--ink)}
.big span{font-size:17px;color:var(--soft)}
.bar{height:16px;border-radius:99px;background:var(--bg);border:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,var(--yellow) 10px 20px);transition:width .5s}
.bar.m i{background:repeating-linear-gradient(-45deg,var(--green) 0 10px,var(--sky) 10px 20px)}.bar.m.over i{background:var(--red)}
.sub{margin:10px 0 0;color:var(--soft);font-size:13.5px;font-weight:600;line-height:1.4}
.lnk{border:0;background:none;padding:6px 0;color:var(--yellow);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}
.lnk svg{width:16px;height:16px}
.sync{font-size:12px;color:var(--soft);margin:6px 4px 0;text-align:right}.sync .lnk{font-size:12px;padding:4px 0}#acct:not(:empty):before{content:' · '}
.bd.an{background:var(--sky)}.bd.ms{background:var(--pink)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:10px}
.mo{border:1.5px solid var(--dash);border-radius:18px;padding:12px 14px}
.mo.now{border:2px solid var(--yellow)}
.mo header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mo header b{font:400 17px "Rammetto One",sans-serif;text-transform:uppercase;color:var(--ink)}
.mo.now header b{color:var(--yellow)}
.mo header small{color:var(--soft);font-weight:600;font-size:12px}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.mt{width:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--soft)}
.mt svg{width:15px;height:15px}
.none{font-size:13px;color:var(--soft)}
.miss{margin:6px 0 4px;border:1.5px dashed var(--dash);border-radius:16px;padding:10px 14px}
.miss summary{cursor:pointer;color:var(--yellow);font-weight:600;min-height:36px}.miss summary b{font-weight:800}
.qt{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qh,.qr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.qh span{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--soft)}
.qr>span{font-weight:600;font-size:14px}
.qr small{display:none}
.qr input{display:block;width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:6px 8px;font-size:16px;-webkit-appearance:none;appearance:none}
@media(max-width:600px){.qh{display:none}.qr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px dashed var(--dash);padding-top:8px}.qr>span:first-child{grid-column:1/-1}.qr small{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--soft);margin-bottom:3px}}
.signbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--blue);color:var(--blk);border-radius:22px;padding:14px 18px;margin-bottom:12px;font-weight:700}
.signbar b{display:block;font:400 18px "Rammetto One",sans-serif;text-transform:uppercase}
.signbar span{flex:1 1 240px;font-size:14px;line-height:1.4}
.signbar .cta{background:var(--ink);box-shadow:3px 3px 0 var(--blk)}
.bk{width:100%;min-height:120px;border:var(--bd);border-radius:14px;background:var(--bg);padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}

/* birthdays + tools */
.bdays{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.bdays>span{display:flex;align-items:center;gap:6px;font:16px "Rammetto One",sans-serif;text-transform:uppercase;color:var(--yellow)}
.bdays svg{width:22px;height:22px}
.bd{border:0;background:var(--yellow);color:var(--blk);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;min-height:36px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:var(--bd);background:transparent;border-radius:99px;min-height:42px;padding:0 15px;font:700 15px Poppins,sans-serif}
.chip small{font:700 12px Poppins,sans-serif;opacity:.7;margin-left:4px}
.chip.on{background:var(--ink);color:var(--blk)}
.chip.need.on{background:var(--pink);border-color:var(--pink)}
.chip.ghost{border-style:dashed;gap:6px}
.chip svg{width:15px;height:15px}
.srch{flex:1 1 200px;min-height:42px;border:var(--bd);background:var(--bg);border-radius:99px;padding:0 20px;font-size:16px}
.vt{display:flex;width:fit-content;margin:16px 0 0;border:var(--bd);border-radius:99px;overflow:hidden}
.vt button{border:0;background:none;min-height:44px;padding:0 20px;font:15px "Rammetto One",sans-serif;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.vt button+button{border-left:2px solid var(--line)}
.vt button.on{background:var(--blue);color:var(--blk)}
.vt small{font:700 12px Poppins,sans-serif;background:var(--bg);color:var(--ink);border-radius:99px;padding:0 8px}

/* cards */
.lay{display:flex;border:var(--bd);border-radius:99px;overflow:hidden}
.lay[hidden]{display:none}
.lay button{border:0;background:none;width:46px;min-height:42px;display:grid;place-items:center;color:var(--ink)}
.lay button+button{border-left:2px solid var(--line)}
.lay button.on{background:var(--ink);color:var(--blk)}
.lay svg{width:18px;height:18px}
.grid.list{grid-template-columns:minmax(0,1fr);gap:8px}
.lrow{display:flex;align-items:center;gap:6px;background:var(--card);border:var(--bd);border-radius:18px;padding:6px 8px 6px 6px}
.lrow.done{border-color:var(--green)}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:2px;min-height:44px}
.ln{flex:1;min-width:0}
.ln b{display:block;font:15px "Rammetto One",sans-serif;text-transform:uppercase;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln .meta{margin-top:2px;flex-wrap:nowrap;overflow:hidden}
.lc{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow.done .lc{color:var(--green)}
.lmain>svg{flex:0 0 18px;width:18px;height:18px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;padding:6px 0 40px}
.card{position:relative;background:var(--card);border:var(--bd);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:9px}
.card.done{border-color:var(--green);background:linear-gradient(rgba(47,155,76,.22),var(--card) 140px)}
.ch{display:flex;gap:10px;align-items:center}
.av{flex:0 0 54px;width:54px;height:54px;border-radius:50%;background:var(--t);display:grid;place-items:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:36px;height:36px}
.av.lg{flex-basis:88px;width:88px;height:88px}.av.lg svg{width:58px;height:58px}
.av.sm{flex:0 0 38px;width:38px;height:38px}.av.sm svg{width:25px;height:25px}
.who{flex:1}
.who h3{font:19px "Rammetto One",sans-serif;text-transform:uppercase;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px;font-size:13px;color:var(--soft);font-weight:600}
.meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta svg{width:15px;height:15px}
.pill{background:var(--t);color:var(--blk);padding:0 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.smp{--t:var(--ink)}
.ib{flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:var(--bd);background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib svg{width:17px;height:17px}
.ib:disabled{opacity:.3;cursor:not-allowed}
.fact{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;border-radius:14px;background:var(--yellow);padding:7px 11px;font-weight:700;font-size:13.5px;color:var(--blk)}
.fact>span{flex:1}
.fact svg{flex:0 0 16px;width:16px;height:16px;margin-top:2px}
.fact small{display:block;font-weight:600;opacity:.7;font-size:11.5px;margin-left:auto;padding-left:8px;white-space:nowrap;align-self:center}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;background:var(--blue);color:var(--blk);font-weight:700;font-size:13px;text-decoration:none}
.links svg{width:14px;height:14px}
.notes{margin:0;font-size:14px;color:var(--soft);font-style:italic;line-height:1.4}
.gl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:6px;border-bottom:1.5px dashed var(--dash)}
.g:last-child{border-bottom:0}
.ck{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;padding:0}
.ck span{width:26px;height:26px;border-radius:50%;border:var(--bd);display:grid;place-items:center;color:transparent;transition:.15s}
.ck svg{width:16px;height:16px}
.g.got .ck span{background:var(--green);border-color:var(--green);color:var(--blk)}
.gn{border:0;background:none;text-align:left;padding:8px 0;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.g.got .gn{color:var(--soft);text-decoration:line-through;text-decoration-color:rgba(184,173,150,.5)}
.gn em{display:inline-flex;color:var(--pink)}.gn svg{width:15px;height:15px}
.glk{width:38px;height:38px;display:grid;place-items:center;color:var(--sky)}.glk svg{width:17px;height:17px}
.pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;padding-right:4px}
.empty{color:var(--soft);font-size:15px;padding:6px 2px}
.addg{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:6px}
.addg input,.f input,.f textarea,.f select{width:100%;min-height:44px;border:var(--bd);border-radius:14px;background:var(--bg);padding:8px 12px;font-size:16px}
.add{border:0;border-radius:14px;background:var(--pink);color:var(--blk);display:grid;place-items:center}
.add svg{width:22px;height:22px}
.gotq{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-weight:600;font-size:14px;min-height:36px}
.gotq span{width:22px;height:22px;border-radius:50%;border:var(--bd);display:grid;place-items:center;color:transparent}
.gotq svg{width:13px;height:13px}
.gotq.on span{background:var(--green);border-color:var(--green);color:var(--blk)}
.cf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--soft);font-weight:600;margin-top:auto}
.cf .over{color:var(--red)}
.cf .tagb{margin-left:auto}
.addp{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:var(--bd);background:transparent;font:13px "Rammetto One",sans-serif;text-transform:uppercase}
.addp svg{width:14px;height:14px}
.addp.on{background:var(--ink);color:var(--blk)}
.past summary{cursor:pointer;color:var(--yellow)}
.past div{font-weight:600;margin-top:6px;color:var(--ink)}
.past b{color:var(--pink);margin-right:4px}
.tagb{width:38px;height:38px;border-radius:50%;border:var(--bd);background:transparent;display:grid;place-items:center;flex:0 0 38px}
.tagb svg{width:16px;height:16px}
.stamp{position:absolute;top:-14px;right:14px;display:flex;align-items:center;gap:5px;background:var(--green);color:var(--blk);font:14px "Rammetto One",sans-serif;text-transform:uppercase;padding:4px 13px 4px 9px;border-radius:99px;transform:rotate(-7deg);box-shadow:3px 3px 0 var(--yellow)}
.stamp svg{width:15px;height:15px}
.stamp.pop{animation:pop .55s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}.bar i{transition:none}}
.hello{grid-column:1/-1;text-align:center;background:var(--card);border:var(--bd);border-radius:26px;padding:30px 20px}
.hello .row{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.hello .row svg{width:46px;height:46px}
.hello h2{font-size:26px}
.hello p{color:var(--soft);max-width:480px;margin:10px auto 18px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;align-items:center}
.shop{grid-column:1/-1;background:var(--card);border:var(--bd);border-radius:22px;padding:14px 16px}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.shead h2{font-size:24px}.shead p{margin:4px 0 0;font-weight:600;color:var(--soft)}
.sbtns{display:flex;flex-wrap:wrap;gap:8px}
.sp{border-top:1.5px dashed var(--dash);padding:8px 0 4px}
.sp header{display:flex;align-items:center;gap:10px}
.sp header b{font:16px "Rammetto One",sans-serif;text-transform:uppercase;font-weight:400}
.sp header .tagb{margin-left:auto}
.sp .gl{padding-left:4px}
.noidea{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1.5px dashed var(--dash);padding-top:10px;margin-top:6px}

/* footer */
.foot{padding:0 0 30px}
.fbox{border:var(--bd);border-radius:20px;padding:12px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:13px;font-weight:600;color:var(--soft)}
.fbox b{font:400 15px "Rammetto One",sans-serif;color:var(--ink)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:var(--bd);border-bottom:0;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 28px;display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:28px;border-bottom:var(--bd)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{font:22px "Rammetto One",sans-serif;text-transform:uppercase;color:var(--pink)}
.f{display:flex;flex-direction:column;gap:6px}
.f>span{font-weight:700;font-size:12.5px;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;text-align:left}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.hint{margin:0;font-size:13.5px;color:var(--soft)}
.phrow{display:flex;gap:14px;align-items:center}
.btn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--blue);color:var(--blk);font-weight:700;cursor:pointer}
.wl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn2.fam{background:var(--green)}
.btn2:disabled{opacity:.6}
.dpo{display:flex;flex-direction:column;gap:6px}.dph{margin:4px 0 0;font-weight:800;color:var(--yellow)}.dph.miss2{color:var(--orange)}

const parseD=s=>{let m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(m)return new Date(+m[1],m[2]-1,+m[3]);m=/^--(\d{2})-(\d{2})$/.exec(s||'');if(m){const d=new Date(1904,m[1]-1,+m[2]);d.noYear=true;return d}return null};
const fmtShort=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

function nextBday(b,now){let t=new Date(now.getFullYear(),b.getMonth(),b.getDate());if(t<now)t=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());return{days:Math.round((t-now)/DAY),turning:t.getFullYear()-b.getFullYear(),date:t}}

const sign=b=>{const m=b.getMonth();return b.getDate()>=SSTART[m]?SIGNS[m]:SIGNS[(m+11)%12]};

function stage(a){
 if(a===0)return 'Baby’s very first holiday season!';
 if(a===1)return 'Age 1: the box and the bow may steal the show';

const MILES=[1,5,10,15,20,25,30];

function tenureTxt(s){const n=today();if(s>n)return 'starts '+fmtShort(s);let y=n.getFullYear()-s.getFullYear();if(n<new Date(n.getFullYear(),s.getMonth(),s.getDate()))y--;

 else out.push(`Work anniversary #${na.years} on ${fmtShort(na.date)}`);
 out.push(`With you since ${fmtLong(s)}`);return out}
function facts(p){const out=[],a=ageOf(p),b=parseD(p.birthday),now=today();
 if(b&&b.noYear){const nb=nextBday(b,now);out.push(nb.days===0?'It’s their birthday today!':`Birthday in ${nb.days} day${nb.days===1?'':'s'}`);out.push(`A ${sign(b)} with ${STONES[b.getMonth()]} as a birthstone`)}
 else if(b&&b<=now){const days=Math.round((now-b)/DAY);const nb=nextBday(b,now);
  out.push(nb.days===0?`It’s their birthday today, turning ${nb.turning}!`:`Turns ${nb.turning} in ${nb.days} day${nb.days===1?'':'s'}`);

const fontsReady=()=>Promise.all(['80px "Rammetto One"','800 80px Poppins','700 80px Poppins'].map(f=>document.fonts?document.fonts.load(f):0)).catch(()=>{});
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fitFont(x,t,max,min,w,fam){let z=max;do{x.font=`${fam.replace('{z}',z)}`;if(x.measureText(t).width<=w)break;z-=2}while(z>min);return z}
function cBurst(x,cx,cy,ro,ri,n,col){x.beginPath();for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=Math.PI*i/n;x[i?'lineTo':'moveTo'](cx+r*Math.sin(a),cy-r*Math.cos(a))}x.closePath();x.fillStyle=col;x.fill()}
function cSpark(x,cx,cy,r,col){x.beginPath();x.moveTo(cx,cy-r);x.quadraticCurveTo(cx,cy,cx+r,cy);x.quadraticCurveTo(cx,cy,cx,cy+r);x.quadraticCurveTo(cx,cy,cx-r,cy);x.quadraticCurveTo(cx,cy,cx,cy-r);x.fillStyle=col;x.fill()}
function cEye(x,cx,cy,w){const h=w*.42;x.beginPath();x.moveTo(cx-w,cy);x.quadraticCurveTo(cx,cy-h*2,cx+w,cy);x.quadraticCurveTo(cx,cy+h*2,cx-w,cy);x.fillStyle=C.cream;x.fill();
 x.beginPath();x.arc(cx,cy,w*.42,0,7);x.fillStyle=C.yellow;x.fill();x.beginPath();x.arc(cx,cy,w*.2,0,7);x.fillStyle=C.blk;x.fill();
 x.strokeStyle=C.blk;x.lineWidth=w*.1;x.lineCap='round';x.beginPath();x.moveTo(cx-w,cy);x.quadraticCurveTo(cx,cy-h*2,cx+w,cy);x.stroke();
 for(let k=-3;k<=3;k++){const t=k/3.6,px=cx+t*w,py=cy-h*(1-t*t)*.98;x.beginPath();x.moveTo(px,py);x.lineTo(px+t*w*.3,py-w*.38);x.stroke()}}
async function tagCanvas(to,d){await fontsReady();const W=1125,H=600,SW=270,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 rr(x,4,4,W-8,H-8,48);x.fillStyle=C.blk;x.fill();x.save();rr(x,4,4,W-8,H-8,48);x.clip();
 if(d.style==='eye'){x.fillStyle=C.blk;x.fillRect(0,0,SW,H);cBurst(x,58,250,70,44,12,C.yellow);
  x.beginPath();x.moveTo(40,H);x.lineTo(40,300);x.arc(135,300,95,Math.PI,0);x.lineTo(230,H);x.closePath();x.fillStyle=C.pink;x.fill();cEye(x,135,320,56);
  x.beginPath();x.arc(170,H,110,Math.PI,0);x.fillStyle=C.red;x.fill();x.beginPath();x.arc(70,H,100,Math.PI,0);x.fillStyle=C.orange;x.fill();x.fillStyle=C.yellow;x.fillRect(-40,H-26,220,26)}
 else if(d.style==='spark'){x.fillStyle=C.blue;x.fillRect(0,0,SW,H);[[70,260,40,C.cream],[190,370,58,C.yellow],[80,480,30,C.pink],[200,220,22,C.cream],[150,540,20,C.cream]].forEach(s=>cSpark(x,...s))}
 else{x.fillStyle=C.blk;x.fillRect(0,0,SW,H);cBurst(x,SW/2,H*0.62,170,118,14,C.green);x.beginPath();x.arc(SW/2,H*0.62,96,0,7);x.fillStyle=C.blk;x.fill();
  x.font='44px "Rammetto One", sans-serif';x.textAlign='center';x.fillStyle=C.pink;x.fillText('FOR',SW/2,H*0.62+16);x.textAlign='left'}
 x.fillStyle=C.cream;x.fillRect(SW,0,4,H);x.restore();
 // hole
 x.beginPath();x.arc(SW/2,96,30,0,7);x.fillStyle=C.blk;x.fill();x.lineWidth=6;x.strokeStyle=C.cream;x.stroke();
 // frames
 rr(x,4,4,W-8,H-8,48);x.lineWidth=8;x.strokeStyle=C.cream;x.stroke();
 rr(x,SW+26,26,W-SW-52,H-52,30);x.lineWidth=3;x.stroke();
 cSpark(x,W-70,70,22,C.orange);cSpark(x,W-70,H-70,16,C.sky);
 const L=SW+66,R=W-90;x.textBaseline='alphabetic';
 x.fillStyle=C.yellow;fitFont(x,d.greet.toUpperCase(),74,30,R-L-40,'{z}px "Rammetto One", sans-serif');x.fillText(d.greet.toUpperCase(),L,160);
 x.font='76px "Rammetto One", sans-serif';x.fillStyle=C.pink;x.fillText('TO:',L,330);const tw=x.measureText('TO:').width;
 x.fillStyle=C.cream;fitFont(x,to,84,32,R-L-tw-28,'800 {z}px Poppins, sans-serif');x.fillText(to,L+tw+28,328);
 x.font='60px "Rammetto One", sans-serif';x.fillStyle=C.sky;x.fillText('FROM:',L,480);const fw=x.measureText('FROM:').width;
 x.fillStyle=C.cream;fitFont(x,d.from||' ',60,24,R-L-fw-26,'700 {z}px Poppins, sans-serif');x.fillText(d.from||'',L+fw+26,478);
 return c}

async function drawPreview(){if(!tagD)return;const to=$('#tto')?$('#tto').value:tagD.names[0];const c=await tagCanvas(to||' ',tagD);const im=$('#tagimg');if(im)im.src=c.toDataURL('image/png')}
function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf.jsPDF);return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(new Error('pdf'));sc.onerror=rej;document.head.appendChild(sc)})}
async function makePdf(btn){const one=tagD.names.length===1;const names=one?[($('#tto').value||'').trim()||tagD.names[0]]:tagD.names;
 if(tagD.from!==state.settings.from||tagD.greet!==state.settings.greet||tagD.style!==state.settings.tagStyle){state.settings.from=tagD.from;state.settings.greet=tagD.greet;state.settings.tagStyle=tagD.style;put('settings',state.settings)}
  const lab=btn.innerHTML;btn.disabled=true;btn.textContent='Making your PDF…';
 try{const JsPDF=await loadJsPDF();const pdf=new JsPDF({unit:'in',format:'letter'});const TW=3.75,TH=2,GX=.25,GY=.15,X0=(8.5-2*TW-GX)/2,Y0=(11-5*TH-4*GY)/2;
  for(let i=0;i<names.length;i++){if(i&&i%10===0)pdf.addPage();const k=i%10,c=await tagCanvas(names[i],tagD);pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',X0+(k%2)*(TW+GX),Y0+Math.floor(k/2)*(TH+GY),TW,TH)}
  const buf=pdf.output('arraybuffer');const fname=one?`gift-tag-${names[0].replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.pdf`:`gift-tags-${state.year}.pdf`;if(dl)await dl.save({filename:fname,data:buf});else pdf.save(fname);toast('Tags saved and ready to print')}
 catch(e){if(!(e&&e.code==='declined'))toast(e&&e.code==='rate_limited'?'One moment, then try again':'Couldn’t make the PDF. Press and hold the picture to save it instead')}
 finally{btn.disabled=false;btn.innerHTML=lab}}

 case 'rmsample':{const gone=ppl().filter(p=>p.sample);gone.forEach(p=>{delete state.people[p.id];put(p.id,null)});render();toast('Sample people removed',()=>{gone.forEach(p=>{state.people[p.id]=p;put(p.id,p)});render()});break}
 case 'grpset':syncDraft();draft.group=v;draft.also=(draft.also||[]).filter(x=>x!==v);reEditor();break;
 case 'alsoset':syncDraft();{const a=draft.also||[];draft.also=a.includes(v)?a.filter(x=>x!==v):a.concat(v)}reEditor();break;
 case 'icset':syncDraft();draft.icon=v;draft.photo='';reEditor();break;
 case 'rmbd':syncDraft();draft.birthday='';reEditor(false);break;
 case 'rmphoto':syncDraft();draft.photo='';reEditor();break;
 case 'lkadd':syncDraft();draft.links.push({url:''});reEditor(false);{const l=document.querySelectorAll('#lk .lu');if(l.length)l[l.length-1].focus()}break;
 case 'lkrm':syncDraft();draft.links.splice(+v,1);reEditor(false);break;
 case 'psave':savePerson();break;
 case 'pdel':{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to remove';break}
  const p=state.people[draft.id];delete state.people[draft.id];put(p.id,null);closeModal();render();toast(`${p.name} removed`,()=>{state.people[p.id]=p;put(p.id,p);render()});break}
 case 'occ':b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));break;
 case 'gsave':case 'gdel':{const sh=$('.sheet'),p=state.people[sh.dataset.p];if(!p)break;const i=p.gifts.findIndex(x=>x.id===sh.dataset.g);if(i<0)break;
  if(a==='gdel'){const g=p.gifts.splice(i,1)[0];put(p.id,p);closeModal();render();toast('Gift deleted',()=>{p.gifts.splice(i,0,g);put(p.id,p);render()});break}
  const g=p.gifts[i],nm=$('#gn').value.trim();if(!nm){$('#gn').classList.add('bad');break}
  const was=isDone(p,state.year);g.name=nm;g.price=parseMoney($('#gp').value)||'';g.url=normUrl($('#gu').value);const yy=parseInt($('#gy').value,10);if(yy>1900&&yy<3000)g.year=yy;
  g.occasion=sh.querySelector('.seg .on').dataset.v;g.got=$('#gg').checked;if(!was&&isDone(p,state.year))state.pop=p.id;put(p.id,p);closeModal();render();break}
 case 'undo':if(undoFn){const f=undoFn;undoFn=null;f();$('#toast').classList.remove('on')}break;
 }});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.classList.contains('addg'))addGift(f.dataset.p,f)});
document.addEventListener('change',async e=>{if(e.target.classList&&e.target.classList.contains('qd')){const p=state.people[e.target.dataset.p];if(p){p[e.target.dataset.k]=e.target.value;if(e.target.dataset.k==='birthday'&&e.target.value)p.age=null;put(p.id,p);renderBd();toast(`Saved for ${p.name}`)}return}
 if(e.target.id==='bkfile'&&e.target.files[0]){e.target.files[0].text().then(t=>{$('#bkin').value=t;toast('File loaded. Tap Import')});return}
 if(e.target.id==='ph'&&e.target.files[0]){try{const d=await readPhoto(e.target.files[0]);syncDraft();draft.photo=d;reEditor()}catch(err){toast('That photo couldn’t be read. Try a JPG or PNG')}}
 if(e.target.id==='fb'){const a=$('#fa');if(a){a.disabled=!!e.target.value;if(e.target.value){a.value='';const t=ageOf({birthday:e.target.value});a.placeholder=(t===null?'':t+' (from birthday)')}else a.placeholder='or just the age'}}});
$('#modal').addEventListener('click',e=>{if(e.target.classList.contains('ov'))closeModal()});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='dpin'){dpPreview();return}if(tagD&&(id==='tto'||id==='tfrom'||id==='tgreet')){if(id==='tfrom')tagD.from=e.target.value;if(id==='tgreet')tagD.greet=e.target.value;clearTimeout(tagTimer);tagTimer=setTimeout(drawPreview,250)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ng'){e.preventDefault();const g=$('[data-act=grpadd],[data-act=grpadd2]');if(g)g.click();return}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal();if(e.key==='Enter'&&e.target.closest&&e.target.closest('.sheet')&&e.target.tagName==='INPUT'){e.preventDefault();const s=$('.sheet [data-act=psave],.sheet [data-act=gsave],.sheet [data-act=bsave],.sheet [data-act=ggsave],.sheet [data-act=bsaveppl]');if(s)s.click()}});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();renderGrid()});

drawArt();render();

// ---------- account sync (Firebase) ----------
// Each signed-in user gets users/<uid>/items/<docId>: one doc per person plus a "settings" doc.
// localStorage stays as an on-device copy so the app still works signed out or offline.
let auth=null,fsdb=null;
function renderAcct(u){const sb=$('#signbar');if(sb)sb.innerHTML=auth&&!u?`<div class="signbar"><span><b>Sign in to sync</b>Save your list to your account so it's the same on your phone and laptop.</span><button class="cta" data-act="signin">Sign in with Google</button></div>`:'';const el=$('#acct');if(!el)return;el.innerHTML=!auth?'':u?`${esc(u.email||'Signed in')} · <button class="lnk" data-act="signout">Sign out</button>`:`<button class="lnk" data-act="signin">Sign in with Google to sync</button>`}
function signIn(){const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
 auth.signInWithPopup(pv).catch(e=>{const c=e&&e.code||'';if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/cancelled-popup-request')auth.signInWithRedirect(pv);else if(c!=='auth/popup-closed-by-user')toast('Sign-in didn’t work ('+c+')')})}
(()=>{
 if(!(window.firebase&&firebase.apps&&firebase.apps.length)){setSync('Saved on this device');return}
 auth=firebase.auth();const fs=firebase.firestore();fsdb=fs;
 try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 auth.getRedirectResult().catch(()=>toast('Sign-in didn’t finish. Try again'));
 let unsub=null;
 auth.onAuthStateChanged(u=>{if(unsub){unsub();unsub=null}col=null;renderAcct(u);
  if(!u){setSync('Saved on this device');return}
  col=fs.collection('users').doc(u.uid).collection('items');setSync('Syncing…');
  let first=true;const t=setTimeout(()=>setSync('Can’t reach your saved list yet. Changes are kept on this device for now'),10000);
  unsub=col.onSnapshot(snap=>{
   if(!snap.metadata.fromCache){clearTimeout(t);setSync('Synced to your account');
    if(first){first=false;if(snap.empty&&ppl().length){ppl().forEach(p=>put(p.id,p));put('settings',state.settings);return}}}
   if(snap.empty&&snap.metadata.fromCache)return;
   const np={};let st=null;snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='settings')st=clone(v);else if(v.type==='person')np[d.id]=clone(v)});
   state.people=np;if(st)state.settings=st;lsSave();render()
  },err=>{clearTimeout(t);col=null;setSync('Couldn’t load your saved list. Changes stay on this device')});
 });
})();
}
